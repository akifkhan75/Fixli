name: API E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-e2e:
    name: API e2e (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixli
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fixli
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fixli:ci-only-password@localhost:5432/fixli?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fixli/shared build
      - run: pnpm --filter @fixli/api db:generate
      - name: Apply migrations
        run: pnpm --filter @fixli/api exec prisma migrate deploy
      - name: E2E tests
        run: pnpm --filter @fixli/api test:e2e
