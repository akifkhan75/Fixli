# A new customer creates an account and lands on the home screen. A different number every run.
appId: com.fixli.app
env:
  API: http://10.0.2.2:3002/api
---
- evalScript: ${output.national = '3017' + String(Date.now()).slice(-6)}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
- tapOn: "Create account"
- assertVisible: "How will you use Fixli?"
- tapOn: "I need a service.*"
- assertVisible: "Your details"
- tapOn:
    id: "name-input"
- inputText: "Maestro Newcomer"
- tapOn:
    id: "phone-input"
- inputText: ${output.national}
- tapOn:
    id: "password-input"
- inputText: "Blue-Tiger-4242"
- hideKeyboard
- tapOn: "Create account"
- extendedWaitUntil:
    visible: "What needs fixing?"
    timeout: 20000
- assertVisible: "Bookings"
