  # Development only. Deployments use apps/api/Dockerfile (a small production image that runs migrations on start).
x-node: &node
  image: node:22
  working_dir: /app
  environment:
    CI: 'true'
  volumes:
    - ./:/app
    - node_modules:/app/node_modules
    - api_node_modules:/app/apps/api/node_modules
    - admin_node_modules:/app/apps/admin/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - shared_node_modules:/app/packages/shared/node_modules
    - pnpm_store:/root/.local/share/pnpm

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixli-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fixli}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fixli}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fixli-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fixli.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Runs once and exits: installs what the three dev servers need (not the phone app), then they start.
  deps:
    <<: *node
    container_name: fixli-deps
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --filter @fixli/api... --filter admin... --filter web... && pnpm --filter @fixli/shared build"

  api:
    <<: *node
    container_name: fixli-api
    command: sh -c "pnpm run db:generate && pnpm run dev:api"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fixli}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fixli}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  admin:
    <<: *node
    container_name: fixli-admin
    command: sh -c "cd apps/admin && pnpm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '5173:5173'
    depends_on:
      deps:
        condition: service_completed_successfully

  web:
    <<: *node
    container_name: fixli-web
    command: sh -c "cd apps/web && pnpm run dev -- --host 0.0.0.0 --port 5174"
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '5174:5174'
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  postgres_data:
  pgadmin_data:
  # Installed once by the `deps` service and kept between runs, so starting the stack is fast.
  pnpm_store:
  node_modules:
  api_node_modules:
  admin_node_modules:
  web_node_modules:
  shared_node_modules:
